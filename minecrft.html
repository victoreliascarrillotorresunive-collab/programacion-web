<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINECRAFT CURIOSIDADES</title>
    
    <style>
        body {
            background-image: url('minecraft.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #ffffff;
            margin: 0;
        }

        h1 {
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
        }

        form {
            width: 450px;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 3px solid #555;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
        }

        label {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        input:focus {
            border-color: #4CAF50;
        }

        button {
            padding: 14px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: 2px solid #ffffff;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #45a049;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <h1>REGISTRO DE CURIOSIDADES MINECRAFT</h1>

    <form onsubmit="window.location.href='mini.html'; return false;">
        
      <label for="nombre">NOMBRE:</label>
      <input type="text" id="nombre" name="NOMBRE" required>
      
      <label for="correo">CORREO:</label>
      <input type="email" id="correo" name="CORREO" required>
      
      
      <label for="contraseña">CONTRASEÑA:</label>
      <input type="password" id="contraseña" name="CORREO" required>
          
      
      <label for="direccion">DIRECCIÓN:</label>
      <input type="text" id="direccion" name="DIRECCION" required>
      <button type="submit">Terminar Registro</button>
        
    </form>

</body>
</html>
