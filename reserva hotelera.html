<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Island — Reservas</title>
  <style>
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #fdf6ec;
      color: #3a3a3a;
      margin: 0;
      line-height: 1.7;
    }

    header {
      background: #2e5d4b;
      color: #fff;
      text-align: center;
      padding: 2.5rem 1rem;
    }

    header h1 { margin: 0; font-size: 2.2rem; }
    header p { margin: .3rem 0 0; font-style: italic; }

    main { max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem; }

    h2 { color: #2e5d4b; border-bottom: 2px solid #d9a441; padding-bottom: .4rem; }

    img {
      width: 100%;
      border-radius: 10px;
      margin-top: .8rem;
    }

    video { width: 100%; border-radius: 10px; margin-top: .8rem; }

    form {
      background: #fff;
      padding: 1.8rem;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,.1);
    }

    label { display: block; font-weight: bold; margin-top: 1rem; }

    input, select, textarea {
      width: 100%;
      padding: .6rem;
      margin-top: .3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      background: #d9a441;
      color: #fff;
      border: none;
      padding: .8rem 1.5rem;
      font-size: 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 1.2rem;
    }

    button:hover { background: #c08f2e; }

    footer {
      text-align: center;
      padding: 1.2rem;
      color: #777;
      font-size: .9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Fantasy Island</h1>
    <p>Un lugar para descansar y desconectar</p>
  </header>

  <main>

    <section>
      <h2>Nuestras Habitaciones</h2>
      <img
        src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1200&q=80"
        alt="Habitación amplia y luminosa con cama grande, ropa blanca y ventana con vista al mar">
      <p>Habitaciones cómodas con WiFi, aire acondicionado y desayuno incluido.</p>
    </section>

    <section>
    EDGAR JOSUE HERNANDEZ GONZALEZ
    +2
    
      <h2>Conoce el Hotel</h2>
      <video controls poster="https://images.unsplash.com/photo-1582719508461-905c673771fd?w=800&q=80">
        <source src=c:\Users\saori\Downloads\Cdev_toolsprograms\videoroatan.mp4 type="video/mp4">
        Tu navegador no soporta video.
      </video>
    </section>

    <section>
      <h2>Haz tu Reserva</h2>
      <form id="reserva" action="#" method="post">

        <label for="nombre">Nombre completo *</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo electrónico *</label>
        <input type="email" id="email" name="email" required>

        <label for="telefono">Teléfono *</label>
        <input type="tel" id="telefono" name="telefono" required>

        <label for="llegada">Fecha de llegada *</label>
        <input type="date" id="llegada" name="llegada" required>

        <label for="salida">Fecha de salida *</label>
        <input type="date" id="salida" name="salida" required>

        <label for="habitacion">Tipo de habitación *</label>
        <select id="habitacion" name="habitacion" required>
          <option value="">Elige una...</option>
          <option value="estandar">Estándar</option>
          <option value="deluxe">Deluxe</option>
          <option value="suite">Suite</option>
        </select>

        <label for="notas">¿Algo que debamos saber?</label>
        <textarea id="notas" name="notas" rows="3"></textarea>

        <button type="submit">Confirmar Reserva</button>
      </form>
    </section>

  </main>

  <footer>
    <p>Fantasy Island · Todos los derechos reservados</p>
  </footer>

  <script>
    // Bloquea el envío si hay campos vacíos o un email inválido
    document.getElementById('reserva').addEventListener('submit', function (e) {
      var email = document.getElementById('email').value;
      var valido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (!valido) {
        e.preventDefault();
        alert('Por favor escribe un correo válido.');
      }
    });
  </script>

</body>
</html>
